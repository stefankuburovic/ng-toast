<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ng-toast · Toast notifications for Angular</title>
<meta name="description" content="Live demo of ng-toast: small, zoneless toast notifications for Angular with promise toasts, actions, a queue, a progress bar and an Angular Material theme.">
<base href="/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Crect x='7' y='9' width='18' height='6' rx='2' fill='white'/%3E%3Crect x='7' y='18' width='18' height='6' rx='2' fill='white' opacity='.6'/%3E%3C/svg%3E">
<!-- Switched on by the Material theme button; toast.css itself is bundled. -->
<link id="material-theme" rel="stylesheet" href="toast-material.css" disabled data-beasties-skip>
<script>
  // Before the first paint, so a stored theme does not flash.
  try {
    var theme = localStorage.getItem('theme');
    if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {}
</script>
</head>
<body>
<demo-root></demo-root>
</body>
</html>
