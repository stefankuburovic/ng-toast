# Tests, builds and the size budget on every pull request and on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Fails when the package grows past its budget (scripts/size.mjs).
      - run: npm run size
      # The playground has to keep compiling against the library.
      - run: npm run demo:build
